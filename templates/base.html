<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سامانه انتخاب رشته{% endblock %}</title>
    
    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS & Flowbite -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />

    <style>
        * {
            font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* استایل هدر دارک شیشه‌ای */
        .dark-navbar {
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* دکمه گرادیانی ثبت‌نام */
        .nav-glow-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
        }
        .nav-glow-btn:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen">

    <!-- Navigation Header Dark -->
    <nav class="dark-navbar px-4 sm:px-6 py-3 fixed left-0 right-0 top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
            
            <!-- لوگو و برند -->
            <a href="/" class="flex items-center gap-2 group">
                <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500/20 via-purple-500/20 to-pink-500/20 border border-white/10 p-0.5 shadow-inner">
                    <div class="flex h-full w-full items-center justify-center rounded-lg bg-[#080d1a] font-black text-indigo-400 text-sm group-hover:text-pink-400 transition-colors">
                        ✦
                    </div>
                </div>
                
                <span class="relative self-center text-lg sm:text-xl font-black tracking-tight text-white group-hover:text-indigo-300 transition-colors">
                    پنل انتخاب رشته
                    <!-- خط گرادیانی زیر متن -->
                    <svg
                        class="absolute -bottom-1.5 right-0 h-2.5 w-full pointer-events-none text-indigo-500"
                        viewBox="0 0 200 20"
                        preserveAspectRatio="none"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M 5,10 C 55,18 145,18 195,8"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round">
                        </path>
                    </svg>
                </span>
            </a>

            <!-- بخش اکشن‌ها و دکمه‌های ورود/خروج -->
            <div class="flex items-center gap-3">
                {% if user.is_authenticated %}
                    <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-300 bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg">
                        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>{{ user.username }}</span>
                    </div>
                    <a href="{% url 'logout' %}" class="text-xs font-bold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 rounded-lg px-3.5 py-2 transition-all">
                        خروج
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 rounded-lg px-3.5 py-2 transition-colors">
                        ورود
                    </a>
                    <a href="{% url 'signup' %}" class="nav-glow-btn text-xs sm:text-sm font-bold text-white rounded-lg px-4 py-2">
                        ثبت‌نام
                    </a>
                {% endif %}
            </div>

        </div>
    </nav>

    <!-- محتوای صفحات -->
    <div class="pt-16">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
</body>
</html>
